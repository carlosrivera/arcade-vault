<meta charset="utf-8">
<title>Isle Diorama — img2threejs reconstruction</title>
<link rel="stylesheet" href="../../shared/model-viewer.css">
<script>
window.__errs = [];
addEventListener('error', (e) => {
  const t = e.target;
  window.__errs.push(t?.src ? `404? ${t.src}` : (e.message || String(e.error)));
}, true);
addEventListener('unhandledrejection', (e) => window.__errs.push(`reject: ${e.reason}`));
</script>
<script type="importmap">
{ "imports": { "three": "../../shared/vendor/three.module.js",
               "three/addons/": "../../shared/vendor/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { createModelViewer } from '../../shared/model-viewer.js';
import { createIsleDiorama } from './dist/dioramaBuild.js';

// Lighting from the spec's lightingFromPhoto: deliberately flat and broad, because the
// reference's value structure is painted into its albedo and hard lighting would double it.
// No rim light - a rim reads as stylised edge lighting, a step toward the cel look that was
// explicitly rejected for this subject.
const key = new THREE.DirectionalLight(0xfff6e2, 1.15);
key.position.set(0.55, 0.78, 0.4).multiplyScalar(3);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0005;
Object.assign(key.shadow.camera, { left: -0.9, right: 0.9, top: 0.9, bottom: -0.9, near: 0.1, far: 8 });
key.shadow.camera.updateProjectionMatrix();
const fill = new THREE.HemisphereLight(0xbfe0ff, 0x4e7a5a, 0.85);
const bounce = new THREE.DirectionalLight(0x7fb4e8, 0.32);
bounce.position.set(-0.6, -0.25, -0.5).multiplyScalar(3);

createModelViewer({
  model: await createIsleDiorama('./layout.json'),
  title: 'ISLE DIORAMA',
  lights: [key, fill, bounce, new THREE.AmbientLight(0xdcebff, 0.42)],
  // Isometric: the reference's slab edges stay parallel, so the projection is orthographic.
  // halfHeight 0.46 was tuned against diagnose_render's scale delta, not derived - the
  // reference's segmented foreground includes its wide cloud spread.
  camera: { orthographic: true, halfHeight: 0.46, azimuth: 45, elevation: 30,
            distanceFactor: 4, viewDistanceFactor: 4 },
  background: 0x0d1117,
});
</script>
