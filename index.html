<style>
  :root {
    --bg-dark: #0b0c16;
    --bg-pattern: #14172b;
    --stone-dark: #191a2e;
    --stone-light: #2c2f4d;
    --gold: #ffcc00;
    --orange: #ff7700;
    --green: #44ee77;
    --red: #ff3344;
    --cyan: #35f0ff;
    --mag: #ff2fd6;
    --pixel-border: #000000;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    image-rendering: pixelated;
  }

  body {
    background-color: var(--bg-dark);
    color: #e4e8ff;
    font-family: 'Press Start 2P', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 60px;
    position: relative;
    overflow-x: hidden;

      linear-gradient(rgba(19, 23, 44, 0.75) 2px, transparent 2px),
      linear-gradient(90deg, rgba(19, 23, 44, 0.75) 2px, transparent 2px),
      radial-gradient(circle at 50% 10%, #1c2242 0%, var(--bg-dark) 70%);

  /* CRT Scanlines Overlay */
  .crt-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.04));
    background-size: 100% 4px, 6px 100%;
    opacity: 0.85;
  }

  /* Top Retro Arcade Bar */

    width: 100%;
    background: #000;
    border-bottom: 4px solid #3a3f68;
    padding: 10px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    letter-spacing: 1px;
    color: #8fa0dd;
    box-shadow: 0 4px 0 #000;
  }

  .topbar-stat {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .topbar-stat .val {
    color: var(--gold);
    text-shadow: 0 0 6px rgba(255, 204, 0, 0.6);
  }

  .topbar-stat .hearts {
    color: var(--red);
    letter-spacing: 2px;

  .crt-toggle {
    background: #1e233d;
    color: #8fa0dd;
    border: 2px solid #3a3f68;
    padding: 4px 8px;
    font-family: inherit;
    font-size: 9px;
    cursor: pointer;
    box-shadow: 2px 2px 0 #000;
  }
  .crt-toggle:hover {
    color: #fff;
    background: #2b335a;
    border-color: var(--cyan);
  }

  /* Main Header */
  header {
    text-align: center;
    margin-top: 45px;
    margin-bottom: 35px;
    position: relative;
    padding: 0 16px;
  }

  .title-wrap {
    display: inline-block;
    background: #0e1122;
    padding: 20px 32px;
    border: 4px solid #000;
    box-shadow: 
      inset 4px 4px 0px #3a3f68, 
      inset -4px -4px 0px #06070d,
      8px 8px 0px #000;
    position: relative;
  }

  .title-wrap::before, .title-wrap::after {
    content: "★";
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: var(--gold);
    font-size: 20px;
    animation: spin-star 3s steps(4) infinite;

  .title-wrap::before { left: 12px; }
  .title-wrap::after { right: 12px; }

  @keyframes spin-star {
    0% { transform: translateY(-50%) rotate(0deg); }
    100% { transform: translateY(-50%) rotate(360deg); }

    font-size: clamp(22px, 4.5vw, 42px);
    letter-spacing: 2px;

    text-shadow:

  .spec-item {

  }

  .spec-item span:last-child {

  .author-row {
    margin-bottom: 18px;

    justify-content: space-between;

  .author-links {

  .author-links a {

  .author-links a:hover {

  /* Big 8-bit Action Button */
  .play-btn {
    background: var(--gold);

    border: 3px solid #000;
    box-shadow: inset 3px 3px 0 #fff085, inset -3px -3px 0 #b38600, 4px 4px 0 #000;
    padding: 14px 18px;
    font-family: inherit;

  .empty-desc {

  /* Footer */
  footer {

    color: #4e5a88;
    letter-spacing: 1px;

  footer span {

</style>

<script>
  // 8-bit Audio Synthesizer for UI feedback
  class RetroAudio {
    constructor() {
      this.ctx = null;
    }
    init() {
      if (!this.ctx) {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }
    hover() {
      try {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(440, t);
        osc.frequency.setValueAtTime(880, t + 0.03);
        gain.gain.setValueAtTime(0.04, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.08);
      } catch(e) {}
    }
    select() {
      try {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, t);
        osc.frequency.exponentialRampToValueAtTime(960, t + 0.15);
        gain.gain.setValueAtTime(0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.22);
      } catch(e) {}
    }
  }

  const sfx = new RetroAudio();

  // Cookie Helpers
  function setCookie(name, value, days = 365) {
    const d = new Date();
    d.setTime(d.getTime() + days * 24 * 60 * 60 * 1000);
    document.cookie = `${name}=${encodeURIComponent(value)};expires=${d.toUTCString()};path=/;SameSite=Lax`;
  }

  function getCookie(name) {
    const match = document.cookie.match(new RegExp(`(?:^|; )${name}=([^;]*)`));
    return match ? decodeURIComponent(match[1]) : null;
  }

  // CRT Toggle with Cookie Persistence
  const crtOverlay = document.getElementById('crtOverlay');
  const crtToggle = document.getElementById('crtToggle');
  const savedCrt = getCookie('pref_crt');
  let crtOn = savedCrt === null ? true : savedCrt === '1';

  function applyCrt(on) {
    crtOn = on;
    crtOverlay.style.display = crtOn ? 'block' : 'none';
    crtToggle.textContent = crtOn ? 'CRT: ON' : 'CRT: OFF';
    setCookie('pref_crt', crtOn ? '1' : '0');
  }

  applyCrt(crtOn);

  crtToggle.addEventListener('click', () => {
    applyCrt(!crtOn);
    sfx.select();
  });

  // Animated Pixel Preview Renderer
  function startPixelCanvas(canvas, gameId = 'gravpulse', _style = {}) {
    const ctx = canvas.getContext('2d');
    canvas.width = 400;
    canvas.height = 200;
    const width = 400;
    const height = 200;
    let frame = 0;

    if (gameId === 'dunesweeper') {
      const renderDesert = () => {
        frame++;
        ctx.fillStyle = '#160e08';
        ctx.fillRect(0, 0, width, height);

        // Warm desert sky gradient
        const skyGrad = ctx.createLinearGradient(0, 0, 0, 120);
        skyGrad.addColorStop(0, '#2d1808');
        skyGrad.addColorStop(0.6, '#6e3810');
        skyGrad.addColorStop(1, '#d5872b');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, width, 120);

        // Radiant desert sun
        ctx.fillStyle = '#ffe57f';
        ctx.beginPath();
        ctx.arc(200, 48, 20, 0, Math.PI * 2);
        ctx.fill();

        // Distant pixel pyramids
        ctx.fillStyle = '#9c5a24';
        ctx.beginPath();
        ctx.moveTo(70, 120);
        ctx.lineTo(130, 60);
        ctx.lineTo(190, 120);
        ctx.fill();

        ctx.fillStyle = '#7a3f12';
        ctx.beginPath();
        ctx.moveTo(130, 60);
        ctx.lineTo(190, 120);
        ctx.lineTo(130, 120);
        ctx.fill();

        ctx.fillStyle = '#b86e2e';
        ctx.beginPath();
        ctx.moveTo(240, 120);
        ctx.lineTo(290, 75);
        ctx.lineTo(340, 120);
        ctx.fill();

        // Foreground desert sand
        const horizon = 115;
        ctx.fillStyle = '#deb578';
        ctx.fillRect(0, horizon, width, height - horizon);

        // Stepped sand dunes
        ctx.fillStyle = '#c69354';
        ctx.fillRect(0, 150, width, height - 150);

        // Excavated ruin block with 3D number & golden relic
        const bx = 200;
        const by = 145 + Math.sin(frame * 0.05) * 3;

        // Voxel stone tile
        ctx.fillStyle = '#8f775c';
        ctx.fillRect(bx - 36, by - 12, 72, 36);
        ctx.fillStyle = '#baa387';
        ctx.fillRect(bx - 32, by - 10, 64, 30);

        // Glowing Golden Relic Scarab
        ctx.fillStyle = '#f5b700';
        ctx.fillRect(bx - 12, by - 24 + Math.sin(frame * 0.08) * 3, 24, 16);
        ctx.fillStyle = '#1f51ff';
        ctx.fillRect(bx - 4, by - 20 + Math.sin(frame * 0.08) * 3, 8, 8);

        // Voxel flag stake
        ctx.fillStyle = '#5d4037';
        ctx.fillRect(bx - 70, by - 12, 4, 28);
        ctx.fillStyle = '#e11d48';
        ctx.fillRect(bx - 66, by - 12, 16, 10);

        // Cactus
        ctx.fillStyle = '#43733d';
        ctx.fillRect(60, 130, 8, 32);
        ctx.fillRect(52, 142, 8, 12);
        ctx.fillRect(52, 138, 8, 4);
        ctx.fillRect(68, 146, 8, 12);
        ctx.fillRect(68, 142, 8, 4);

        requestAnimationFrame(renderDesert);
      };
      renderDesert();
      return;
    }

    const stars = Array.from({ length: 45 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      speed: 0.6 + Math.random() * 2.2,
      size: Math.random() > 0.6 ? 3 : 2,
      color: Math.random() > 0.5 ? '#35f0ff' : '#ff2fd6',
    }));

    const render = () => {
      frame++;
      ctx.fillStyle = '#060814';
      ctx.fillRect(0, 0, width, height);

      // 3D-like scrolling pixel grid floor
      ctx.strokeStyle = 'rgba(53, 240, 255, 0.25)';
      ctx.lineWidth = 1.5;
      const horizon = 110;

      // Horizon glow
      const grad = ctx.createLinearGradient(0, horizon - 30, 0, horizon + 50);
      grad.addColorStop(0, 'rgba(255, 47, 214, 0.4)');
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.fillRect(0, horizon - 30, width, 80);

      // Starfield
      for (const s of stars) {
        s.x -= s.speed;
        if (s.x < 0) s.x = width;
        ctx.fillStyle = s.color;
        ctx.fillRect(Math.floor(s.x), Math.floor(s.y * 0.55), s.size, s.size);
      }

      // Perspective grid lines
      const vanishingX = width / 2;
      for (let x = -width; x <= width * 2; x += 32) {
        ctx.beginPath();
        ctx.moveTo(vanishingX, horizon);
        ctx.lineTo(x, height);
        ctx.stroke();
      }

      // Horizontal moving grid lines
      const gridOffset = (frame * 1.8) % 18;
      for (let y = horizon; y <= height; y += (y - horizon) * 0.28 + 4) {
        const drawY = y + gridOffset * ((y - horizon) / 80);
        if (drawY <= height && drawY >= horizon) {
          ctx.beginPath();
          ctx.moveTo(0, drawY);
          ctx.lineTo(width, drawY);
          ctx.stroke();
        }
      }

      // 8-bit Anti-Grav Hovercraft Sprite
      const shipX = width / 2 + Math.sin(frame * 0.05) * 24;
      const shipY = horizon + 30 + Math.cos(frame * 0.08) * 8;

      // Thruster trail glow
      ctx.fillStyle = frame % 4 < 2 ? '#ff2fd6' : '#ffb02e';
      ctx.fillRect(shipX - 14, shipY + 6, 8, 4);
      ctx.fillRect(shipX + 6, shipY + 6, 8, 4);

      // Ship body (pixel stepped polygon)
      ctx.fillStyle = '#112244';
      ctx.fillRect(shipX - 16, shipY, 32, 8);
      ctx.fillStyle = '#35f0ff';
      ctx.fillRect(shipX - 10, shipY - 6, 20, 6);
      ctx.fillRect(shipX - 4, shipY - 10, 8, 4);

      // Canopy
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(shipX - 2, shipY - 6, 4, 4);

      // Wingtips
      ctx.fillStyle = '#ff2fd6';
      ctx.fillRect(shipX - 20, shipY + 2, 4, 6);
      ctx.fillRect(shipX + 16, shipY + 2, 4, 6);

      requestAnimationFrame(render);
    };

    render();
  }

  let allGames = [];
  let currentFilter = getCookie('pref_cat') || 'all';

  function renderGallery() {
    const galleryEl = document.getElementById('gallery');
    galleryEl.innerHTML = '';

    const filteredGames = allGames.filter((game) => {
      if (currentFilter === 'all') return true;
      const cat = currentFilter.toLowerCase();
      const genre = (game.genre || '').toLowerCase();
      const tags = (game.tags || []).map((t) => t.toLowerCase());
      const title = (game.title || '').toLowerCase();
      return genre.includes(cat) || tags.includes(cat) || title.includes(cat);
    });

    if (filteredGames.length === 0) {
      galleryEl.innerHTML = `
        <div style="color:#7b8ebd; font-size:11px; text-align:center; padding:40px; grid-column: 1 / -1;">
          [ NO CARTRIDGES FOUND FOR FILTER: ${currentFilter.toUpperCase()} ]
        </div>
      `;
      return;
    }

    filteredGames.forEach((game, _index) => {
      const card = document.createElement('a');
      card.className = 'game-card';
      card.href = game.path;

      const st = game.style || {};
      const fullLlmModel = game.llm || 'LLM';
      // Short name for topbar e.g. "Gemini 2.5 Flash" -> "Gemini"
      const shortModel = game.llmShort || (fullLlmModel.split(' ')[0] || 'AI');
      const badgeText = game.badge || (game.id === 'dunesweeper' ? 'VOXEL 3D' : '3D RACER');
      const author = game.author || {};
      const authorName = author.name || 'Anonymous';

      let authorLinksHtml = '';
      if (author.github) {
        authorLinksHtml += `<a href="https://github.com/${author.github}" target="_blank" rel="noreferrer" onclick="event.stopPropagation()">GH</a>`;
      }
      if (author.x) {
        authorLinksHtml += `<a href="https://x.com/${author.x}" target="_blank" rel="noreferrer" onclick="event.stopPropagation()">X</a>`;
      }
      if (author.url && !author.github) {
        authorLinksHtml += `<a href="${author.url}" target="_blank" rel="noreferrer" onclick="event.stopPropagation()">WEB</a>`;
      }

      card.innerHTML = `
        <div class="card-topbar">
          <span class="system-badge"><span class="led-dot"></span> [ ${shortModel} ]</span>
          <span class="genre-tag">${game.genre || 'ARCADE'}</span>
        </div>

        <div class="preview-wrap">
          <canvas class="preview-canvas" id="canvas-${game.id}"></canvas>
          <div class="badge-overlay">${badgeText}</div>
        </div>

        <div class="card-body">
          <div class="card-title-row">
            <div class="card-title">${game.title}</div>
            <div class="card-sub">${game.subtitle || '// LLM MODULE //'}</div>
          </div>

          <p class="card-desc">${game.description}</p>

          <div class="card-specs">
            <div class="spec-item"><span>LLM:</span> <span style="color:var(--cyan)">${fullLlmModel}</span></div>
            <div class="spec-item"><span>PLAYERS:</span> <span style="color:#fff">${game.players || '1-4 PLAYERS'}</span></div>
          </div>

          <div class="author-row">
            <span class="author-name">AUTHOR: <span style="color:#fff">${authorName}</span></span>
            <div class="author-links">${authorLinksHtml}</div>
          </div>

          <div class="play-btn">
            <span>INSERT COIN &amp; PLAY</span>
            <span>▶</span>
          </div>
        </div>
      `;

      card.addEventListener('mouseenter', () => sfx.hover());
      card.addEventListener('click', () => sfx.select());

      galleryEl.appendChild(card);

      // Start 8-bit animated canvas preview
      const canvas = document.getElementById(`canvas-${game.id}`);
      if (canvas) startPixelCanvas(canvas, game.id, st);
    });

    // Append slot 03 placeholder
    const emptyCard = document.createElement('div');
    emptyCard.className = 'empty-card';
    emptyCard.innerHTML = `
      <div class="empty-icon">⛏</div>
      <div class="empty-title">[ SLOT 03: EMPTY ]</div>
      <div class="empty-desc">READY FOR NEXT LLM GENERATED GAME MODULE. SHARED THREE.JS READY.</div>
    `;
    galleryEl.appendChild(emptyCard);
  }


  // Load Games
  async function loadGallery() {
    try {
      const res = await fetch('games.json');
      allGames = await res.json();

      // Apply saved category filter button state
      document.querySelectorAll('.cat-btn').forEach((btn) => {
        const cat = btn.getAttribute('data-cat');
        btn.classList.toggle('active', cat === currentFilter);
      });

      renderGallery();
    } catch (err) {
      console.error(err);
      const galleryEl = document.getElementById('gallery');
      galleryEl.innerHTML = `
        <div style="color:var(--red); font-size:12px; text-align:center; padding:40px;">
          [ SYSTEM ERROR: CARTRIDGE DATA CORRUPTED ]
        </div>
      `;
    }
  }

  // Interactive Category Buttons with Cookie Persistence
  document.querySelectorAll('.cat-btn').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.cat-btn').forEach((b) => {
        b.classList.remove('active');
      });
      e.currentTarget.classList.add('active');
      currentFilter = e.currentTarget.getAttribute('data-cat') || 'all';
      setCookie('pref_cat', currentFilter);
      sfx.select();
      renderGallery();
    });
  });

  window.addEventListener('DOMContentLoaded', loadGallery);
</script>

</body>
