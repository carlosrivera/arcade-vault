<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Arcade Vault neon pixel-art social card</title>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03040a" stop-opacity=".18"/>
      <stop offset=".62" stop-color="#03040a" stop-opacity=".08"/>
      <stop offset="1" stop-color="#03040a" stop-opacity=".72"/>
    </linearGradient>
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pinkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity=".18"/>
    </pattern>
  </defs>
  <image x="0" y="0" width="1200" height="630" preserveAspectRatio="xMidYMid slice" xlink:href="og-card-background.png"/>
  <rect width="1200" height="630" fill="url(#shade)"/>
  <rect x="175" y="76" width="850" height="330" rx="26" fill="#080a18" fill-opacity=".78" stroke="#000" stroke-width="12"/>
  <rect x="190" y="91" width="820" height="300" rx="16" fill="none" stroke="#35f0ff" stroke-width="5" filter="url(#cyanGlow)"/>
  <rect x="202" y="103" width="796" height="276" rx="10" fill="none" stroke="#ff2fd6" stroke-width="3" filter="url(#pinkGlow)"/>
  <text x="600" y="218" text-anchor="middle" font-family="Courier New, monospace" font-size="93" font-weight="900" letter-spacing="9" fill="#ff2fd6" transform="translate(-5 -5)">ARCADE</text>
  <text x="600" y="218" text-anchor="middle" font-family="Courier New, monospace" font-size="93" font-weight="900" letter-spacing="9" fill="#35f0ff" transform="translate(5 5)">ARCADE</text>
  <text x="600" y="218" text-anchor="middle" font-family="Courier New, monospace" font-size="93" font-weight="900" letter-spacing="9" fill="#fff">ARCADE</text>
  <text x="600" y="322" text-anchor="middle" font-family="Courier New, monospace" font-size="93" font-weight="900" letter-spacing="9" fill="#ff2fd6" transform="translate(-5 -5)">VAULT</text>
  <text x="600" y="322" text-anchor="middle" font-family="Courier New, monospace" font-size="93" font-weight="900" letter-spacing="9" fill="#35f0ff" transform="translate(5 5)">VAULT</text>
  <text x="600" y="322" text-anchor="middle" font-family="Courier New, monospace" font-size="93" font-weight="900" letter-spacing="9" fill="#fff">VAULT</text>
  <rect x="330" y="342" width="540" height="54" rx="4" fill="#05060d" stroke="#ffcc00" stroke-width="3"/>
  <text x="600" y="377" text-anchor="middle" font-family="Courier New, monospace" font-size="20" font-weight="700" letter-spacing="4" fill="#ffcc00">8-BIT BROWSER GAMES</text>
  <rect x="315" y="510" width="570" height="66" rx="5" fill="#05060d" fill-opacity=".9" stroke="#35f0ff" stroke-width="3"/>
  <text x="600" y="552" text-anchor="middle" font-family="Courier New, monospace" font-size="21" font-weight="700" letter-spacing="3" fill="#35f0ff">▶ PRESS START TO PLAY ◀</text>
  <rect width="1200" height="630" fill="url(#scanlines)" pointer-events="none"/>
  <rect x="12" y="12" width="1176" height="606" rx="18" fill="none" stroke="#182348" stroke-width="12"/>
</svg>
